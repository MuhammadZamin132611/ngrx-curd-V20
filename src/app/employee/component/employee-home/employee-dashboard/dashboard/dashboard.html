<section class="p-5">
    <div class="flex justify-between">
        <h1 class="text-2xl font-semibold">Employee Dashboard</h1>
        <div class="flex justify-end w-1/2">
            <input type="search" class="w-1/2 bg-white focus:outline-none py-1.5 px-3 border-2 border-gray-100 rounded-md"
                placeholder="Search Employee...">
        </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-2 py-3">
        <div class="bg-white shadow-md rounded-lg p-3">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-medium">Employee Details</h2>
                <button class="bg-green-50" routerLink="/dashboard/home/add-employee" mat-button><mat-icon>add</mat-icon>Employee</button>
            </div>
            <p class="text-gray-700 text-lg font-semibold py-3">Manage All Employee Details and track easy way</p>
            <button class="w-full bg-gray-50" routerLink="/dashboard/home/view-employee" mat-button><mat-icon></mat-icon>View All Employee</button>
        </div>
        <div class="bg-white shadow-md rounded-lg p-3">Performance</div>
    </div>
</section>
