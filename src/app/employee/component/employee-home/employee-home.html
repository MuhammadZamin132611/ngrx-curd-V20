<app-header />
<section class="bg-gray-100">
    <mat-drawer-container autosize class="drawerContainer">
        <mat-drawer class="sideMenu" #drawer [opened]="isMenuOpen" [disableClose]="drawerMode === 'over'" [mode]="drawerMode"
            position="start" >
            <app-side-menu />
        </mat-drawer>
        <mat-drawer-content class="drawerContent">
            <router-outlet />
        </mat-drawer-content>
    </mat-drawer-container>
</section>
