<section class="transition-all duration-300" >
    <!-- Profile + Divider -->
    <div class="grid gap-5 pb-3">
        <div class="flex items-center justify-between gap-3 cursor-pointer" routerLink="/recuriter/layout/dashboard/profile">
            <div class="flex items-center gap-3">
                
                <div class="text-center">
                    <h3 class="text-gray-800 text-base font-semibold whitespace-nowrap text-center">{{userName}}</h3>
                    <h2 class="text-[#0175A2] text-sm font-medium whitespace-nowrap text-center">Employee {{userRole?'Admin':'User'}}</h2>
                </div>
            </div>
        </div>
        <div class="bg-gray-200 w-full h-[0.75px]"></div>
    </div>

    <!-- Menu (desktop only) -->
    <div class="hidden md:block">
        <div class="grid gap-1">
            @for(menu of menuList; track $index) {
            <a class="flex items-center gap-3 p-2" [routerLink]="menu.link" routerLinkActive="linkactive">
                <mat-icon
                    [ngClass]="{ 'text-[#0175A2]': isActiveRoute(menu.link), 'text-gray-500': !isActiveRoute(menu.link) }">{{menu.iconName}}</mat-icon>
                <!-- @if(isExpanded){ -->
                <span
                    [ngClass]="{ 'text-[#0175A2]': isActiveRoute(menu.link), 'text-gray-500': !isActiveRoute(menu.link) }"
                    class="text-base font-semibold whitespace-nowrap">
                    {{menu.listName}}
                </span>
                <!-- } -->
            </a>
            }
        </div>
    </div>

    <div class="md:hidden block">
        <div class="grid gap-1">
            @for(menu of menuList; track $index) {
            <a class="flex items-center gap-3 p-2" (click)="toggleMenu()" [routerLink]="menu.link"
                routerLinkActive="linkactive">
                <mat-icon
                    [ngClass]="{ 'text-[#0175A2]': isActiveRoute(menu.link), 'text-gray-500': !isActiveRoute(menu.link) }">{{menu.iconName}}</mat-icon>
                <span
                    [ngClass]="{ 'text-[#0175A2]': isActiveRoute(menu.link), 'text-gray-500': !isActiveRoute(menu.link) }"
                    class="text-base font-semibold whitespace-nowrap">
                    {{menu.listName}}
                </span>
            </a>
            }
        </div>
    </div>
</section>
